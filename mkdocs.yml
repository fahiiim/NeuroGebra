site_name: NeuroGebra
site_description: "Make the mathematics visible. Symbolic formulas, automatic differentiation, neural networks, scientific experiments, and training observability in Python."
site_url: https://neurogebra.readthedocs.io
repo_url: https://github.com/fahiiim/NeuroGebra
repo_name: fahiiim/NeuroGebra
copyright: "Copyright &copy; 2026 Fahim Sarker — MIT License"

theme:
  name: material
  custom_dir: overrides
  logo: assets/neurogebra-icon-teal.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  font: false

hooks:
  - scripts/docs_hooks.py

extra_css:
  - stylesheets/neurogebra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.keys
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true

