name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]" build twine
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q
      - name: Validate documentation
        run: |
          python -m mkdocs build --strict
          python scripts/check_docs.py --site site
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the installed wheel outside the checkout
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import os, neurogebra; from neurogebra import MathForge; assert "v" + neurogebra.__version__ == os.environ["RELEASE_TAG"]; assert MathForge().get("sigmoid").eval(x=0) == 0.5; print(neurogebra.__version__)'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - run: python -m pip install twine
      - name: Publish prerelease to TestPyPI
        if: github.event.release.prerelease
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: "1"
        run: python -m twine upload --repository testpypi dist/*
      - name: Publish stable release to PyPI
        if: "!github.event.release.prerelease"
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: "1"
        run: python -m twine upload dist/*
